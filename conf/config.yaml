# ============================================================
# Uni-HOI 4.0 — Global Configuration
# ============================================================
defaults:
  - _self_

# --- Run Config ---
run:
  job: train          # full | train | eval | step1 | step2 | step3 | step4 | step5 | preprocess_and_train
  name: debug
  seed: 42

# --- Global Paths ---
base_weights_dir: /data4/guanz/coding/HDM/model
project_root: /data4/guanz/coding/HDM

# --- Data Prep Config ---
data_prep:
  input_dir: ./sample_data  # switch to /data4/guanz/data/Behave for full dataset
  video_name: test_video     # sub-folder under input_dir
  output_subdir: processed   # results saved to <input_dir>/<video_name>/<output_subdir>/
  max_frames: null            # null = process all frames
  device: cuda

# --- SAM3 Config (2D text-prompted segmentation + video tracking) ---
sam3:
  model_dir: ${base_weights_dir}/sam3
  text_prompts:
    - human
    - object
  score_threshold: 0.5
  mask_threshold: 0.5

# --- SAM3D Body Config (3D human mesh recovery) ---
sam3d:
  checkpoint: ${base_weights_dir}/sam-3d-body/model.ckpt
  mhr_model: ${base_weights_dir}/sam-3d-body/assets/mhr_model.pt
  config_yaml: ${base_weights_dir}/sam-3d-body/model_config.yaml
  image_size: [512, 512]

# --- UniDepth V2 Config (metric monocular depth) ---
unidepth:
  model_dir: ${base_weights_dir}/unidepth
  backbone: vitl14  # ViT-L/14 backbone

# --- OpenPose Config (2D keypoint detection) ---
openpose:
  model_dir: ${base_weights_dir}/openpose

# --- SMPL-H Body Model ---
smplh:
  model_dir: ${base_weights_dir}/smpl_models/smplh

# --- Depth Alignment ---
depth_align:
  method: median  # median-based scale+shift alignment

# --- Multi-Region Masking ---
masking:
  dilate_kernel_size: 15   # morphological dilation kernel
  dilate_iterations: 2
  contact_radius: 10       # px radius around projected contact joints
  gaussian_blur_ksize: 11  # soft-edge Gaussian blur kernel
  gaussian_blur_sigma: 5.0

# ============================================================
# Step 2: Amodal Video Completion (ProPainter)
# ============================================================
propainter:
  weights_dir: ${base_weights_dir}/ProPainter/weights
  mask_dilation: 4
  ref_stride: 10
  neighbor_length: 10
  subvideo_length: 80
  raft_iter: 20
  fp16: true
  save_frames: true
  save_fps: 24

amodal:
  output_subdir: amodal     # results saved to <input_dir>/<video_name>/<output_subdir>/

# ============================================================
# Step 3: Zero-shot 3D Lifting via Hunyuan3D-2
# ============================================================
hy3d:
  # HuggingFace model ID or local path to Hunyuan3D-2 weights
  model_path: /data4/guanz/models/Hunyuan3D-2
  subfolder: hunyuan3d-dit-v2-0
  # Inference parameters
  num_inference_steps: 50
  guidance_scale: 5.0
  octree_resolution: 384
  # 3DGS sampling from generated mesh
  num_sample_points: 4096
  init_gaussian_scale: 0.01
  # Preprocessing
  remove_background: false
  dtype: float16

step3:
  output_subdir: gs_init    # results saved to <input_dir>/<video_name>/<output_subdir>/
  frame_selection: middle   # which amodal frame to use: middle, first, last, or int index

# ============================================================
# Step 3.5: Metric Alignment Bridge (between Step 3 and Step 4)
# ============================================================
alignment:
  enabled: true
  depth_max: 10.0
  depth_min_pixels: 50
  percentile: 90.0
  scale_eps: 1.0e-4
  scale_default: 1.0
  scale_min: 0.01
  scale_max: 100.0
  human_align_strategy: smplh    # "smplh" or "unproject"
  validate_transform: true

# ============================================================
# Step 4: Multi-Region Contact-Aware Joint 3DGS Optimization
# ============================================================
step4:
  output_subdir: joint_opt
  image_height: 256
  image_width: 256
  num_points_human: 4096
  num_points_object: 2048
  focal: 500.0
  num_iters: 5000
  save_every: 1000
  # Per-parameter learning rates
  lr_xyz: 1.6e-4
  lr_opacity: 5e-2
  lr_scaling: 5e-3
  lr_rotation: 1e-3
  lr_color: 2.5e-3
  # SE(3) coordinate registration
  se3:
    lr_translation: 1e-3
    lr_rotation: 1e-4
  # Multi-region rendering loss
  region_loss:
    weight_visible: 1.0
    weight_primary_occ: 0.3
    weight_secondary_occ: 0.05
    lambda_ssim: 0.2
  # Contact loss (hand joints ↔ object Gaussians)
  contact:
    enabled: true
    lambda_contact: 0.5
  # 2D projection loss (SMPL-H → 2D vs OpenPose)
  proj2d:
    enabled: true
    lambda_j2d: 0.1
    confidence_threshold: 0.3
  # Penetration loss (volumetric SMPL SDF)
  penetration:
    enabled: true
    lambda_pen: 1.0
    sdf_grid_resolution: 64
    sdf_padding: 0.1
  # Temporal smoothness (acceleration)
  temporal:
    enabled: true
    lambda_acc: 0.5

# ============================================================
# Step 5: End-to-End Pipeline Integration & Validation
# ============================================================
step5:
  num_epochs: 2
  num_iters_per_epoch: 500
  eval:
    cd_thresholds: [0.005, 0.01, 0.02, 0.05]
    num_eval_points: 4096
    compute_acceleration: true
  vis:
    save_rendered_images: true
    save_overlay_keypoints: true
    save_novel_views: true
    video_fps: 24

# --- Checkpoint Config ---
checkpoint:
  path: ""          # explicit path to checkpoint file
  run_id: latest    # "latest" or specific run timestamp

# --- Dataset Shorthand ---
# Use "sample" for ./sample_data, "behave" for /data4/guanz/data/Behave
dataset: sample

# --- Model Overrides (for CLI convenience) ---
model:
  epochs: null

