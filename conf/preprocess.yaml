# ============================================================
# Offline Data Preprocessing Config (Step 1 Prior Extraction)
# ============================================================
defaults:
  - _self_

# --- Global Paths ---
base_weights_dir: /data4/guanz/coding/HDM/model
project_root: /data4/guanz/coding/HDM

# --- Input / Output ---
input_dir: ./sample_data          # switch to /data4/guanz/data/Behave for full dataset
video_name: test_video             # sub-folder under input_dir
output_subdir: processed           # results → <input_dir>/<video_name>/<output_subdir>/
max_frames: null                   # null = process all frames
device: cuda

# --- SAM3 (text-prompted 2D segmentation + video tracking) ---
sam3:
  model_dir: ${base_weights_dir}/sam3
  text_prompts:
    - human
    - object
  score_threshold: 0.5
  mask_threshold: 0.5

# --- SAM3D Body (3D human mesh recovery → SMPL-H) ---
sam3d:
  checkpoint: ${base_weights_dir}/sam-3d-body/model.ckpt
  mhr_model: ${base_weights_dir}/sam-3d-body/assets/mhr_model.pt
  config_yaml: ${base_weights_dir}/sam-3d-body/model_config.yaml
  image_size: [512, 512]

# --- UniDepth V2 (metric monocular depth) ---
unidepth:
  model_dir: ${base_weights_dir}/unidepth
  backbone: vitl14

# --- OpenPose (2D keypoint detection) ---
openpose:
  model_dir: ${base_weights_dir}/openpose

# --- SMPL-H body model ---
smplh:
  model_dir: ${base_weights_dir}/smpl_models/smplh

# --- Depth Alignment ---
depth_align:
  method: median

# --- Multi-Region Masking ---
masking:
  dilate_kernel_size: 15
  dilate_iterations: 2
  contact_radius: 10
  gaussian_blur_ksize: 11
  gaussian_blur_sigma: 5.0
